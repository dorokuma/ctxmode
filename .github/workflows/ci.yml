name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Install host isolation target fixture
        # A clean Ubuntu runner has no hc/herdr-core anywhere: TestMain's
        # mustVerifyOuterTestIsolation needs at least one real target to
        # enumerate-and-mask (an empty set means "nothing proves the
        # namespace" and the suite refuses to run). Install an inert
        # placeholder at /usr/local/bin — deliberately WITHOUT the
        # CTXMODE-NS-HC-STANDIN tag, so inside the namespace the ro bind
        # is what supplies the tag, exactly like a real host binary.
        run: |
          fixture=$(mktemp)
          printf '#!/bin/sh\necho "UNMASKED-HOST-HC" >&2\nexit 99\n' > "$fixture"
          sudo install -m 0755 "$fixture" /usr/local/bin/herdr-core
          rm -f "$fixture"
          sudo ln -sf /usr/local/bin/herdr-core /usr/local/bin/hc
      - run: make check
