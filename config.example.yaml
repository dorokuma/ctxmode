# Example ctxmode configuration.
# Copy to ~/.config/ctxmode/config.yaml or pass via -config / $CTXMODE_CONFIG.
#
# Lookup order:
#   -config flag > $CTXMODE_CONFIG > ./ctxmode-config.yaml > ~/.config/ctxmode/config.yaml

workdirs:
  - /root
  - /tmp

# Shell / argv command policy (P3). Default mode is "denylist": normal
# shell/argv commands run, built-in high-risk commands and patterns are
# refused. Set mode to "off" to fully disable the policy (escape hatch /
# legacy behavior), or "allowlist" for hardened deployments.
# Override at runtime: CTXMODE_POLICY_MODE=allowlist|denylist|off
policy:
  shell:
    mode: denylist # denylist (default) | allowlist | off
    # When mode=allowlist, first token (basename) of each simple command must be listed.
    allow:
      - go
      - git
      - npm
      - cargo
      - make
      - python3
      - node
      - rg
      - ls
      - cat
      - echo
      - true
      - false
      - pwd
      - mkdir
      - cp
      - mv
      - rm
      - touch
      - chmod
      - head
      - tail
      - wc
      - sort
      - uniq
      - tee
      - env
      - which
      - test
      - "["
      - sleep
      - tar
      - gzip
      - unzip
      - curl
      - wget
      - docker
      - ssh
      - scp
      - rsync
    # deny: user entries are MERGED with the built-in deny set (never replace
    # it). Built-in denied commands (basename): shutdown, reboot, poweroff,
    # halt, init, telinit; mkfs / mkfs.*, fdisk, sfdisk, cfdisk, parted,
    # wipefs, dd, shred; bulk firewall restore commands; su, sudo, doas,
    # pkexec. Mutation subcommands for ip/route/ifconfig/iptables/nft,
    # power actions for systemctl, and sysctl writes are also refused, while
    # read-only diagnostics remain allowed. To permit one of these, use
    # mode=allowlist with it listed under allow (deny set is not consulted
    # in allowlist mode).
    deny:
      - nmap
      - tcpdump
    # deny_patterns: user entries are MERGED with built-in patterns. Applied
    # whenever mode != off (full command string, shell and argv paths).
    # Built-ins: curl/wget piped through wrappers into a shell, command/process
    # substitution, and common fork-bomb literals like ':(){ :|:& };:'.
    deny_patterns:
      - '(?i)\bhydra\b'
    # rm safety: workdir-relative deletes allowed; system roots denied.
    # Note: if /root is a workdir, rm under /root/... is allowed.
    rm:
      allow_in_workdir: true
      deny_system_paths: true
    # Optional override of protected system prefixes (defaults shown):
    # system_paths:
    #   - /bin
    #   - /boot
    #   - /dev
    #   - /etc
    #   - /lib
    #   - /lib64
    #   - /proc
    #   - /sys
    #   - /sbin
    #   - /usr
    #   - /var
