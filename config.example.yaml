# Example ctxmode configuration.
# Copy to ~/.config/ctxmode/config.yaml or pass via -config / $CTXMODE_CONFIG.
#
# Lookup order:
#   -config flag > $CTXMODE_CONFIG > ./ctxmode-config.yaml > ~/.config/ctxmode/config.yaml

workdirs:
  # Workspace roots: every cwd/path argument is resolved against them.
  # Replace with your own directories.
  - /path/to/your/project
  - /path/to/another/project
